name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the manifest version
        required: true
        default: v0.21.0-beta.1
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build without launching Photoshop
        run: python tools/build_release.py --tag "${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: StarStudio-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
