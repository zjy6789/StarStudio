name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python syntax
        run: python -m compileall -q backend tools tests
      - name: Python numerical and bridge regressions
        run: python -m pytest -q
      - name: JavaScript syntax and public manifest
        shell: pwsh
        run: |
          Get-ChildItem plugin/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -c "import json; from pathlib import Path; json.loads(Path('plugin/manifest.json').read_text()); assert not Path('plugin/bridge.json').exists()"
      - name: UXP pixel and processing regressions
        run: node --test tests/test_star_processing.js tests/test_host_write.js tests/test_model_settings.js tests/test_star_canvas.js tests/test_extract.js tests/test_stack.js tests/test_stack_layers.js tests/test_panel_startup.js tests/test_linear_preparation.js tests/test_background.js tests/test_protected_stretch.js tests/test_protection_masks.js tests/test_sky_color.js
