name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q backend tools tests
      - name: JavaScript syntax and public manifest
        shell: pwsh
        run: |
          Get-ChildItem plugin/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -c "import json; from pathlib import Path; json.loads(Path('plugin/manifest.json').read_text()); assert not Path('plugin/bridge.json').exists()"
